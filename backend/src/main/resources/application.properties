spring.application.name=backend
server.port=${PORT:8080}

# --- Database (needed for the full-login User table) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:scribbledb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please-32bytes-min}
jwt.guest-expiration-minutes=${JWT_GUEST_EXPIRATION_MINUTES:360}
jwt.user-expiration-minutes=${JWT_USER_EXPIRATION_MINUTES:60}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:14}