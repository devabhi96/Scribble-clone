version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: local-dev-only-secret-change-me-32bytes-min
      DB_URL: jdbc:h2:mem:scribbledb;DB_CLOSE_DELAY=-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend